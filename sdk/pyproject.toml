[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-sdk"
version = "1.0.0"
description = "Command line, Python SDK and MCP server for a running JARVIS"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
jarvis = "jarvis_sdk.cli:main"
jarvis-mcp = "jarvis_sdk.mcp_server:serve"

[tool.setuptools]
packages = ["jarvis_sdk"]
