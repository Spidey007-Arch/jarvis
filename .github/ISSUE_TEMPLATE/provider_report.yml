name: 🧪 AI provider test report
description: Tell us how JARVIS works with your AI provider
labels: [question]
body:
  - type: markdown
    attributes:
      value: Only Gemini and the local gateway are verified live so far. Reports for every other provider help a lot. Never paste your key.
  - type: input
    id: provider
    attributes:
      label: Provider and model
      placeholder: OpenAI gpt-5-mini / Ollama llama3.2 / Groq …
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What worked
      options:
        - label: Connecting and listing models
        - label: Chat replies
        - label: Tools (opening apps, files, commands)
        - label: Memory (remembering facts across conversations)
        - label: Switching models when one was busy or out of quota
  - type: textarea
    id: problems
    attributes:
      label: What didn't work
      description: Error messages and log lines (remove anything private).
